<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HeimdalL - Thor MIR4 EU</title>
  <meta property="og:title" content="Thor MIR4 EU">
  <meta property="og:image" content="thor-mir4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12040a;
      --gold: #f6c244;
      --gold-soft: #b8903a;
      --text: #fbeed0;
      --red-1: #a30f22;
      --red-2: #d3162b;
      --card: rgba(24, 4, 10, .78);
      --serif: "Cinzel", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      position: relative;
      isolation: isolate;
    }
    /* Full-quality background artwork, only lightly darkened so it stays bright and sharp */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse at center, rgba(18, 4, 10, .10) 0%, rgba(18, 4, 10, .55) 100%),
        url("thor-mir4-bg.jpg") center / cover no-repeat;
    }
    main {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 9vw, 3.4rem);
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--gold);
      text-shadow: 0 0 18px rgba(246, 194, 68, .45), 0 2px 0 rgba(0, 0, 0, .6);
    }
    h2 {
      margin: 10px 0 20px;
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: .12em;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    }
    .banner {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 2px solid var(--gold-soft);
      box-shadow: 0 0 28px rgba(211, 22, 43, .35), 0 18px 50px rgba(0, 0, 0, .7);
      margin-bottom: 22px;
    }
    .card {
      padding: 16px;
      border: 1px solid var(--gold-soft);
      border-radius: 18px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      padding: 15px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .05em;
    }
    a.discord {
      background: #2a0610;
      color: var(--gold);
      border: 1px solid var(--gold-soft);
    }
    a.register {
      background: linear-gradient(180deg, var(--red-2), var(--red-1));
      color: #fff;
      border: 1px solid #e8b04a;
    }
    a.btn:hover, a.btn:focus-visible { filter: brightness(1.2); outline: none; }
    a.btn:focus-visible { box-shadow: 0 0 0 3px var(--gold); }
  </style>
</head>
<body>
  <main>
    <h1>HeimdalL</h1>
    <h2>Thor Mir4</h2>
    <img class="banner" src="thor-mir4.jpg" alt="Thor MIR4 EU official Discord server artwork" width="1000" height="1000">
    <div class="card">
      <a class="btn discord" href="https://discord.gg/CdbTdVzS">Discord</a>
      <a class="btn register" href="https://account.thormir.com/register.html?ref=1020">Register your account now</a>
    </div>
  </main>
</body>
</html>
